<title>Friday Night Video</title>
<style>html,body{margin:0;height:100%;background:#120d08}#fnvLoad{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#f4ead2;font:32px "Courier New",monospace;letter-spacing:.2em;text-align:center;padding:0 40px}</style>
<div id="fnvLoad">LOADING TAPE…</div>
<script>
// Loader: fetches the store straight from GitHub each time the app opens,
// so updates show up without waiting for jsDelivr's cache. Falls back to the
// last copy that loaded, then to the copy bundled next to this file.
(function () {
  var SRC = "https://raw.githubusercontent.com/timmydouglas98-netizen/friday-night-video/HEAD/app/store.html";
  var done = false;
  function show(html) {
    if (done) return; done = true;
    try { localStorage.setItem("fnv-store-cache", html); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  function looksRight(t) { return t && t.indexOf("fnv-prefs") !== -1 && t.indexOf("<\/script>") !== -1; }
  function fail() {
    var el = document.getElementById("fnvLoad");
    if (el) el.textContent = "Couldn't reach the store. Check the TV's internet connection, then reopen the app.";
  }
  function get(url, ok, bad, ms) {
    var x = new XMLHttpRequest();
    x.open("GET", url);
    x.timeout = ms;
    x.onload = function () { if (x.status === 200 && looksRight(x.responseText)) ok(x.responseText); else bad(); };
    x.onerror = x.ontimeout = bad;
    x.send();
  }
  function fallback() {
    var cached = null;
    try { cached = localStorage.getItem("fnv-store-cache"); } catch (e) {}
    if (looksRight(cached)) { show(cached); return; }
    get("store.html", show, fail, 15000);
  }
  get(SRC + "?t=" + Date.now(), show, fallback, 10000);
})();
</script>
