<style>
/* The title card: what's on screen while the store loads. Painted the same way as the store: flat colour, hard edges, brown-black ink. */
html, body { margin: 0; height: 100%; background: #1d2558; overflow: hidden; }
#card { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-box; display: flex; -webkit-box-orient: vertical; flex-direction: column; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; text-align: center; }
#burst { position: absolute; top: 50%; left: 50%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; }
#vig { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(10,6,24,.55) 100%); }
#plate { position: relative; padding: 4vh 7vh 4.4vh; background: #c8352b; border: .6vh solid #2a1c18; border-radius: 3vh; box-shadow: 1.4vh 1.8vh 0 rgba(10,6,24,.55), inset 0 -1.2vh 0 rgba(0,0,0,.18); max-width: 84vw; }
.t1 { font: 600 3.2vh/1 Oswald, "Arial Narrow", Arial, sans-serif; letter-spacing: .34em; text-transform: uppercase; color: #f0b93a; }
.t2 { margin-top: 1.6vh; font: 400 12vh/.98 Caprasimo, "Cooper Black", "Bookman Old Style", Georgia, serif; color: #fff3d6;
  text-shadow: .45vh 0 0 #2a1c18, -.45vh 0 0 #2a1c18, 0 .45vh 0 #2a1c18, 0 -.45vh 0 #2a1c18, .45vh .45vh 0 #2a1c18, -.45vh .45vh 0 #2a1c18, .45vh -.45vh 0 #2a1c18, -.45vh -.45vh 0 #2a1c18, .5vh 1.1vh 0 #2a1c18; }
.t2 small { display: block; font-size: .42em; line-height: 1.1; color: #f0b93a; }
.t3 { position: relative; margin-top: 5vh; font: 500 3.2vh/1 Oswald, "Arial Narrow", Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #fff3d6; text-shadow: .3vh .3vh 0 #2a1c18; }
.t3 i { font-style: normal; display: inline-block; width: 1.6em; text-align: left; }
#msg { position: relative; margin-top: 2vh; max-width: 70vw; font: 500 2.8vh/1.35 Oswald, "Arial Narrow", Arial, sans-serif; color: #f0b93a; text-shadow: .25vh .25vh 0 #2a1c18; }
</style>
<div id="card">
  <svg id="burst" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
  <div id="vig"></div>
  <div id="plate"><div class="t1">Tonight at</div><div class="t2" id="nm"><small>Friday Night</small>Video</div></div>
  <div class="t3" id="ld">Loading tape<i id="dots"></i></div>
  <div id="msg"></div>
</div>
<script>
// Friday Night Video loader (app/index.html).
// 1. Shows the title card while it works (for at least a moment, like the top of an episode).
// 2. Reads release.json from the repo to find which tagged release the TVs should run, e.g. {"ref": "v2", "version": "0.17.0"}.
// 3. If that release is the one already saved on this TV, opens the saved copy (fast, no download).
//    Otherwise downloads that release's app/store.html, checks it arrived whole and is the version promised, and opens it.
// 4. A new release only becomes the saved copy once it has opened and stayed up for a few seconds (the store says so).
//    A release that fails to open twice is skipped, and the TV keeps using the last good copy.
// 5. With no internet: the saved copy, then the copy bundled with this file.
(function () {
  "use strict";
  var REPO = "timmydouglas98-netizen/friday-night-video";
  var RAW = "https://raw.githubusercontent.com/" + REPO + "/";
  var MIN_CARD_MS = 1400, started = Date.now(), done = false;

  // the sunburst behind the title
  (function () {
    var s = "", n = 24;
    for (var i = 0; i < n; i++) {
      var a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
      s += '<polygon points="0,0 ' + (Math.cos(a0) * 150).toFixed(1) + "," + (Math.sin(a0) * 150).toFixed(1) + " " + (Math.cos(a1) * 150).toFixed(1) + "," + (Math.sin(a1) * 150).toFixed(1) + '" fill="' + (i % 2 ? "#26307a" : "#1d2558") + '"/>';
    }
    document.getElementById("burst").innerHTML = s;
  })();

  var ls = null; try { ls = window.localStorage; } catch (e) {}
  function lget(k) { try { return ls ? ls.getItem(k) : null; } catch (e) { return null; } }
  function lset(k, v) { try { if (ls) ls.setItem(k, v); return true; } catch (e) { return false; } }
  function ldel(k) { try { if (ls) ls.removeItem(k); } catch (e) {} }

  // the store's own name on the card
  try {
    var p = JSON.parse(lget("fnv-prefs") || "{}"), name = p && typeof p.storeName === "string" ? p.storeName.replace(/\s+/g, " ").trim().slice(0, 40) : "";
    if (name) {
      var w = name.split(" "), last = w.length > 1 ? w.pop() : w[0], first = w.length && w[0] !== last ? w.join(" ") : "";
      var nm = document.getElementById("nm"); nm.innerHTML = "";
      if (first) { var sm = document.createElement("small"); sm.textContent = first; nm.appendChild(sm); }
      nm.appendChild(document.createTextNode(last));
    }
  } catch (e) {}

  // "Loading tape..." on twos
  var dots = document.getElementById("dots"), dn = 0;
  var dotT = setInterval(function () { dn = (dn + 1) % 4; dots.textContent = ["", ".", "..", "..."][dn]; }, 420);

  function msg(t) { document.getElementById("msg").textContent = t; }
  function show(html) {
    if (done) return; done = true;
    var wait = Math.max(0, MIN_CARD_MS - (Date.now() - started));
    setTimeout(function () { clearInterval(dotT); document.open(); document.write(html); document.close(); }, wait);
  }
  // a whole store, not half a download: the right markers, and it ends where the store ends
  function looksRight(t) {
    return typeof t === "string" && t.length > 50000 && t.indexOf("fnv-prefs") !== -1 && t.indexOf("APP_VERSION") !== -1 && /<\/script>\s*(<\/body>\s*)?(<\/html>\s*)?$/.test(t);
  }
  function get(url, ms, ok, bad) {
    var fin = false;
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url);
      x.timeout = ms;
      x.onload = function () { if (fin) return; fin = true; if (x.status === 200) ok(x.responseText); else bad(); };
      x.onerror = x.ontimeout = function () { if (fin) return; fin = true; bad(); };
      x.send();
    } catch (e) { if (!fin) { fin = true; bad(); } }
  }
  function fail() {
    clearInterval(dotT);
    document.getElementById("ld").textContent = "Closed for the night";
    msg("Couldn't reach the store. Check the TV's internet connection, then reopen the app.");
  }
  function fallback() {
    var c = lget("fnv-store-cache");
    if (looksRight(c)) return show(c);
    get("store.html", 15000, function (t) { if (looksRight(t)) show(t); else fail(); }, fail);
  }

  // the last launch tried a new release and it never said it opened properly
  var pending = lget("fnv-boot-pending"), bad = lget("fnv-bad-ref");
  if (pending) {
    ldel("fnv-boot-pending");
    var f = (lget("fnv-boot-fails") || "").split("|"), n = f[0] === pending ? (parseInt(f[1], 10) || 0) + 1 : 1;
    lset("fnv-boot-fails", pending + "|" + n);
    if (n >= 2) { bad = pending; lset("fnv-bad-ref", pending); }
  }
  var good = null; try { good = JSON.parse(lget("fnv-good") || "null"); } catch (e) {}

  get(RAW + "HEAD/release.json?t=" + Date.now(), 6000, function (t) {
    var rel = null; try { rel = JSON.parse(t); } catch (e) {}
    if (!rel || typeof rel.ref !== "string" || !/^[A-Za-z0-9._\-\/]{1,80}$/.test(rel.ref)) return fallback();
    if (rel.ref === bad) return fallback();
    var cached = lget("fnv-store-cache");
    if (good && good.ref === rel.ref && looksRight(cached)) return show(cached);
    get(RAW + rel.ref + "/app/store.html", 20000, function (html) {
      if (!looksRight(html)) return fallback();
      if (rel.version && html.indexOf('APP_VERSION = "' + rel.version + '"') === -1) return fallback();
      try { sessionStorage.setItem("fnv-next-html", html); } catch (e) {}
      lset("fnv-boot-pending", rel.ref);
      show(html);
    }, fallback);
  }, fallback);
})();
</script>
